# Root development environment for the statistical-network-analysis-with-Julia
# ecosystem. Activate it with `julia --project=/path/to/snwj` to get every
# package `dev`ed from its sibling checkout via the [sources] entries below:
#
#     julia --project=. -e 'using Pkg; Pkg.instantiate()'
#     julia --project=. -e 'using ERGM, SNA, Siena'
#
# Each package remains an independent git repo with its own Project.toml; this
# file only stitches the checkouts together for whole-ecosystem development.

[deps]
ERGM = "d623cd87-b018-4e2a-bf53-b77ebcdc9da2"
ERGMCount = "7556d106-17e3-4d5c-b2ff-836722c37052"
ERGMEgo = "531197fe-e020-4211-8eb0-cc8301fb2806"
ERGMMulti = "99f84e8c-6b40-471e-a588-cae4f29dcbed"
ERGMRank = "fe60baf2-d676-4e16-b57d-34cb7d88af67"
ERGMUserterms = "fb82099d-cb11-4d76-9fd7-dea636fffb01"
NDTV = "d08b9634-086a-4eae-932f-e15cd61d6088"
Networks = "027a387e-e55f-4537-a155-5037e5a23bdb"
NetworkDynamic = "2ec8e4a1-edb9-4657-8cef-4d333c164b0b"
REM = "f78d20dc-c2b5-46e6-a2d4-577bd45c3c5a"
Relevent = "ff95e53f-ef79-4eb6-bb6b-7db73a0b5534"
SNA = "199dfc94-006f-42e6-80fa-49ca4fc5f549"
Siena = "23c1be1b-04c0-4290-87a8-83c04253ada6"
TERGM = "6fc22812-126d-4a5c-ac3d-a5f62b7af224"
TSNA = "d87fbcfe-12dd-4101-bd65-651c391eab70"

[sources]
ERGM = {path = "ERGM.jl"}
