ERGMUserterms = {path = "ERGMUserterms.jl"}
NDTV = {path = "NDTV.jl"}
Networks = {path = "Networks.jl"}
NetworkDynamic = {path = "NetworkDynamic.jl"}
REM = {path = "REM.jl"}
Relevent = {path = "Relevent.jl"}
SNA = {path = "SNA.jl"}
Siena = {path = "Siena.jl"}
