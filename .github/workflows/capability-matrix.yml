name: Capability matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  JULIA_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '1'
  SNWJ_ROOT: ${{ github.workspace }}

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: statistical-network-analysis-with-Julia.github.io
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Prepare sibling packages and documentation dependencies
        run: julia statistical-network-analysis-with-Julia.github.io/tools/prepare_workspace.jl "$SNWJ_ROOT" --clone
      - name: Test the tooling gates
        run: julia statistical-network-analysis-with-Julia.github.io/tools/test/runtests.jl
      - name: Regenerate and check the capability matrix
        run: julia --project=.snippet-env statistical-network-analysis-with-Julia.github.io/tools/generate_capability_matrix.jl --check
