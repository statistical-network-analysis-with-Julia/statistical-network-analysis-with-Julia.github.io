name: Executable documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  JULIA_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '1'
  SNWJ_ROOT: ${{ github.workspace }}

jobs:
  snippets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: statistical-network-analysis-with-Julia.github.io
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install animation export dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg imagemagick librsvg2-bin
          # ImageMagick delegates SVG input to rsvg-convert on Ubuntu.
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="2" height="2"><rect width="2" height="2"/></svg>' > "$RUNNER_TEMP/animation-check.svg"
          convert "$RUNNER_TEMP/animation-check.svg" "$RUNNER_TEMP/animation-check.gif"
      - name: Prepare sibling packages and documentation dependencies
        run: julia statistical-network-analysis-with-Julia.github.io/tools/prepare_workspace.jl "$SNWJ_ROOT" --clone
      - name: Test the tooling gates
        run: julia statistical-network-analysis-with-Julia.github.io/tools/test/runtests.jl
      - name: Execute every package README, documentation page, and site example
        run: julia --project=.snippet-env statistical-network-analysis-with-Julia.github.io/tools/check_snippets.jl
