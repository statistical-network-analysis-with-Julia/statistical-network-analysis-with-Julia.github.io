name: Benchmark regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  JULIA_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '1'
  SNWJ_ROOT: ${{ github.workspace }}

jobs:
  benchmark-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: statistical-network-analysis-with-Julia.github.io
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Prepare sibling packages and documentation dependencies
        run: julia statistical-network-analysis-with-Julia.github.io/tools/prepare_workspace.jl "$SNWJ_ROOT" --clone
      - name: Test the tooling gates
        run: julia statistical-network-analysis-with-Julia.github.io/tools/test/runtests.jl
      - name: Allocation and dedicated regression gates
        run: julia statistical-network-analysis-with-Julia.github.io/tools/run_benchmarks.jl --regressions-only
      - name: Scheduled timing suites and embedded scaling assertions
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: julia statistical-network-analysis-with-Julia.github.io/tools/run_benchmarks.jl
